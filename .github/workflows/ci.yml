# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline for Rust (WASM) and Java (Chicory & Wasmtime)

name: Rust & Java CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # 1. Build and Test Job
  build-and-test:
    name: Build & Test (Rust & Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up wasip1 toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip1
          components: clippy, llvm-tools-preview

      - name: Set up wasip2 toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy, llvm-tools-preview

      - name: Compile Rust project (Standard)
        run: cargo build --verbose

      - name: Run Rust test suite
        run: cargo test --verbose

      - name: Run Rust code linter
        run: cargo clippy -- -D warnings

      - name: Build and Test Java (Chicory)
        run: |
          cargo build --target wasm32-wasip1 --release
          cd java
          mvn -f pom-chicory.xml install
          java -jar target/fsscanner-runner-1.0-SNAPSHOT.jar

      - name: Build and Test Java (Wasmtime)
        run: |
          cargo build --target wasm32-wasip2 --release
          cd java
          mvn -f pom-wasmtime.xml install
          java -jar target/fsscanner-runner-1.0-SNAPSHOT.jar

  # 2. Separate Coverage Job
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install grcov
        run: cargo install grcov

      - name: Generate profile data
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "target/coverage/cargo-test-%p-%m.profraw"
        run: cargo test

      - name: Process report with grcov
        run: |
          mkdir -p target/coverage/html
          grcov . --binary-path ./target/debug/deps/ -s . -t html --branch --ignore-not-existing --ignore '../*' --ignore "/*" -o target/coverage/html

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/coverage/html/
          retention-days: 1

